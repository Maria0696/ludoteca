name: Mantener Supabase activo

# El plan gratuito de Supabase pausa los proyectos con poca actividad en
# 7 días. Esta tarea llama a la función ping() tres veces al día.
# Si Supabase no responde (por ejemplo, porque ya está pausado), la tarea
# falla y GitHub te avisa por correo.

on:
  schedule:
    - cron: "17 1,9,17 * * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 30 --retry-all-errors \
            -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'

      # GitHub desactiva las tareas programadas de los repositorios públicos
      # tras 60 días sin actividad. Volver a activarla reinicia ese plazo.
      - name: Mantener la tarea programada activa
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable mantener-supabase.yml --repo "${{ github.repository }}"
