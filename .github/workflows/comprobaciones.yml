name: Comprobaciones

# Tipos, lint y pruebas de extremo a extremo en cada petición de fusión y en
# cada cambio de main. Las pruebas compilan su propia copia en modo local,
# así que no necesitan ninguna clave.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: comprobaciones-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # La misma versión que «engines» en package.json, la que usa Vercel.
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Las pruebas usan el Chrome que ya trae la máquina de GitHub.
      - name: Pruebas de extremo a extremo
        run: npx playwright test --reporter=line

      - name: Guardar el informe si algo falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: informe-de-pruebas
          path: test-results/
          retention-days: 7
